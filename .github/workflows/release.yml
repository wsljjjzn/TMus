name: build-release

# 手动触发，或推送 v* 标签时自动构建并上传 GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            artifact: TMus-macos-arm64
            ffasset: ffmpeg-darwin-arm64.gz
          - os: macos-13        # Intel
            artifact: TMus-macos-x86_64
            ffasset: ffmpeg-darwin-x64.gz
          - os: windows-latest  # x64
            artifact: TMus-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 编译 release
        run: cargo build --release

      # ---------- macOS：打包二进制 + 静态 ffmpeg（同目录，目标机器免安装） ----------
      - name: 打包 macOS（含静态 ffmpeg）
        if: startsWith(matrix.os, 'macos')
        run: |
          FF_URL="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/${{ matrix.ffasset }}"
          curl -sL -o /tmp/ffmpeg.gz "$FF_URL"
          gunzip -f /tmp/ffmpeg.gz
          chmod +x /tmp/ffmpeg
          rm -rf dist && mkdir -p dist
          cp target/release/tmus dist/
          cp /tmp/ffmpeg dist/ffmpeg
          cp README.md dist/
          cp install.ps1 dist/ 2>/dev/null || true
          (cd dist && zip -rq "tmus-macos.zip" .)
          mv dist/tmus-macos.zip "${{ matrix.artifact }}.zip"

      # ---------- Windows：打包 exe + 官方静态 ffmpeg.exe ----------
      - name: 打包 Windows（含 ffmpeg.exe）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rm -rf dist; mkdir dist
          Copy-Item target/release/tmus.exe dist/tmus.exe
          curl.exe -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive ffmpeg.zip -DestinationPath ff
          $exe = Get-ChildItem -Recurse ff -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/ffmpeg.exe
          Copy-Item README.md dist/
          Copy-Item install.ps1 dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      # 推送 v* 标签时自动附加到 GitHub Release
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
