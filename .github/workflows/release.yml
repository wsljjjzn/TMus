name: build-release

# 手动触发，或推送 v* 标签时自动构建并上传 GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon（原生 arm64） + Intel（交叉编译 x86_64），同一台 runner 完成
          - os: macos-14
          - os: windows-latest  # x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: 编译（原生）
        run: cargo build --release

      # ---------- macOS：原生 arm64 + 交叉 x86_64，各配静态 ffmpeg ----------
      - name: 交叉编译 Intel 版
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: 打包 macOS（arm64 + x86_64，含静态 ffmpeg）
        if: runner.os == 'macOS'
        run: |
          curl -sL -o /tmp/ff-arm.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz
          curl -sL -o /tmp/ff-x64.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64.gz
          gunzip -f /tmp/ff-arm.gz /tmp/ff-x64.gz
          chmod +x /tmp/ff-arm /tmp/ff-x64

          rm -rf dist-arm dist-intel
          mkdir -p dist-arm dist-intel
          cp target/release/tmus dist-arm/tmus
          cp /tmp/ff-arm dist-arm/ffmpeg
          cp target/x86_64-apple-darwin/release/tmus dist-intel/tmus
          cp /tmp/ff-x64 dist-intel/ffmpeg
          cp README.md install.sh install.ps1 dist-arm/
          cp README.md install.sh install.ps1 dist-intel/

          (cd dist-arm && zip -rq ../TMus-macos-arm64.zip .)
          (cd dist-intel && zip -rq ../TMus-macos-x86_64.zip .)

      # ---------- Windows：exe + 官方静态 ffmpeg.exe ----------
      - name: 打包 Windows（含 ffmpeg.exe）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/tmus.exe dist/tmus.exe
          curl.exe -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive ffmpeg.zip -DestinationPath ff
          $exe = Get-ChildItem -Recurse ff -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/ffmpeg.exe
          Copy-Item README.md dist/
          Copy-Item install.ps1 dist/
          Compress-Archive -Path dist/* -DestinationPath TMus-windows-x86_64.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}
          path: TMus-*.zip

      # 推送 v* 标签时自动附加到 GitHub Release
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TMus-*.zip
