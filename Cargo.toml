[package]
name = "tmus"
version = "0.1.0"
edition = "2021"
description = "tmus：终端音乐播放器 —— 浏览文件夹、播放本地音频（ffmpeg 解码，支持 32-bit FLAC）、符号频谱可视化"

[dependencies]
cpal = "0.15"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde_json = "1.0.151"

# 更小的发布二进制
[profile.release]
strip = true

# 仅 Windows 编译/链接（设置控制台 UTF-8 代码页）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
